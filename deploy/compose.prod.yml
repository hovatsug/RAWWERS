services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_data_prod:/data

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
    volumes:
      - meili_data_prod:/meili_data

  api:
    image: ghcr.io/${GITHUB_REPOSITORY:-rawwers/rawwers}/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./deploy/.env.prod
    depends_on:
      - postgres
      - redis
      - meilisearch
    ports:
      - "8000:8000"

  # Everything except photo processing. Concurrency is set, not left to
  # Celery's default of one process per CPU on whatever host this lands on.
  worker:
    image: ghcr.io/${GITHUB_REPOSITORY:-rawwers/rawwers}/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: celery -A app.tasks.celery_app.celery_app worker -l info -Q media --concurrency ${WORKER_CONCURRENCY:-4}
    env_file:
      - ./deploy/.env.prod
    depends_on:
      - postgres
      - redis

  # Photo derivatives on their own processes, so reminders, index rebuilds
  # and outbound calls never queue in front of a photographer's upload.
  # Each process holds a decoded original (about 135 MB for a 45 MP frame,
  # ~300 MB at peak with its derivatives), so this is capped deliberately.
  worker-photos:
    image: ghcr.io/${GITHUB_REPOSITORY:-rawwers/rawwers}/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: celery -A app.tasks.celery_app.celery_app worker -l info -Q photos --concurrency ${PHOTO_WORKER_CONCURRENCY:-4} -n photos@%h
    env_file:
      - ./deploy/.env.prod
    depends_on:
      - postgres
      - redis

  beat:
    image: ghcr.io/${GITHUB_REPOSITORY:-rawwers/rawwers}/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: celery -A app.tasks.celery_app.celery_app beat -l info
    env_file:
      - ./deploy/.env.prod
    depends_on:
      - postgres
      - redis

  web:
    image: ghcr.io/${GITHUB_REPOSITORY:-rawwers/rawwers}/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./deploy/.env.prod
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data_prod:
  redis_data_prod:
  meili_data_prod:
