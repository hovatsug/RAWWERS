name: E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"

jobs:
  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BASE_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start E2E stack
        run: docker compose -f deploy/compose.e2e.yml up -d --build

      - name: Wait for services
        run: |
          for i in {1..40}; do
            if curl -fsS http://localhost:8000/healthz >/dev/null && curl -fsS http://localhost:3000 >/dev/null; then
              echo "Services ready"
              exit 0
            fi
            sleep 3
          done
          echo "Services did not become healthy in time"
          docker compose -f deploy/compose.e2e.yml logs
          exit 1

      - name: Seed E2E data
        run: docker compose -f deploy/compose.e2e.yml exec -T api python scripts/seed_dev.py --deterministic

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: web
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright E2E
        working-directory: web
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results

      - name: Upload stack logs
        if: always()
        run: docker compose -f deploy/compose.e2e.yml logs > e2e-stack.log

      - name: Save stack logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-stack-logs
          path: e2e-stack.log

      - name: Tear down stack
        if: always()
        run: docker compose -f deploy/compose.e2e.yml down -v
