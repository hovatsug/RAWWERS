name: Build images (manual)

# Deploys are run by hand on the server (docs/DEPLOY_RUNBOOK.md). This
# workflow used to deploy by itself on every push to main and every v* tag,
# and copied the example env file over the server's real one; both jobs are
# gone (2026-11-21). What is left builds and pushes the two images when
# started by hand from the Actions tab. CI image builds for the runbook are a
# LATER row (BETA_SCOPE).
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "image_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ steps.meta.outputs.image_tag }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: ghcr.io/${{ github.repository }}/web:${{ steps.meta.outputs.image_tag }}

      - name: Build changelog notes
        run: |
          chmod +x deploy/changelog_notes.sh
          deploy/changelog_notes.sh > release_notes.md

      - name: Upload release notes artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md
