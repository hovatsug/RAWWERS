name: Deploy

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "image_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ steps.meta.outputs.image_tag }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: ghcr.io/${{ github.repository }}/web:${{ steps.meta.outputs.image_tag }}

      - name: Build changelog notes
        run: |
          chmod +x deploy/changelog_notes.sh
          deploy/changelog_notes.sh > release_notes.md

      - name: Upload release notes artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pre-deploy release gate
        env:
          GATE_HEALTH_URL: ${{ secrets.STAGING_HEALTH_URL }}
          GATE_READY_URL: ${{ secrets.STAGING_READY_URL }}
          GATE_PROMETHEUS_URL: ${{ secrets.STAGING_PROMETHEUS_URL }}
          GATE_PROMETHEUS_TOKEN: ${{ secrets.STAGING_PROMETHEUS_TOKEN }}
        run: python3 deploy/release_gate.py --env staging --fail-open-if-no-metrics

      - name: Deploy to staging host
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            mkdir -p /opt/rawwers/deploy
            cd /opt/rawwers
            if [ ! -d .git ]; then
              git clone ${{ secrets.DEPLOY_REPO_URL }} .
            fi
            git fetch --all
            git checkout ${{ github.sha }}
            cp deploy/.env.staging.example deploy/.env.staging || true
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}|" deploy/.env.staging || echo "IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}" >> deploy/.env.staging
            docker compose --env-file deploy/.env.staging -f deploy/compose.staging.yml pull
            docker compose --env-file deploy/.env.staging -f deploy/compose.staging.yml up -d

      - name: Post-deploy release gate
        env:
          GATE_HEALTH_URL: ${{ secrets.STAGING_HEALTH_URL }}
          GATE_READY_URL: ${{ secrets.STAGING_READY_URL }}
          GATE_PROMETHEUS_URL: ${{ secrets.STAGING_PROMETHEUS_URL }}
          GATE_PROMETHEUS_TOKEN: ${{ secrets.STAGING_PROMETHEUS_TOKEN }}
        run: python3 deploy/release_gate.py --env staging

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pre-deploy production release gate
        env:
          GATE_HEALTH_URL: ${{ secrets.PROD_HEALTH_URL }}
          GATE_READY_URL: ${{ secrets.PROD_READY_URL }}
          GATE_PROMETHEUS_URL: ${{ secrets.PROD_PROMETHEUS_URL }}
          GATE_PROMETHEUS_TOKEN: ${{ secrets.PROD_PROMETHEUS_TOKEN }}
        run: python3 deploy/release_gate.py --env production

      - name: Deploy to production host
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_DEPLOY_HOST }}
          username: ${{ secrets.PROD_DEPLOY_USER }}
          key: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          script: |
            mkdir -p /opt/rawwers/deploy
            cd /opt/rawwers
            if [ ! -d .git ]; then
              git clone ${{ secrets.PROD_DEPLOY_REPO_URL }} .
            fi
            git fetch --all
            git checkout ${{ github.ref_name }}
            cp deploy/.env.prod.example deploy/.env.prod || true
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}|" deploy/.env.prod || echo "IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}" >> deploy/.env.prod
            docker compose --env-file deploy/.env.prod -f deploy/compose.prod.yml pull
            docker compose --env-file deploy/.env.prod -f deploy/compose.prod.yml up -d

      - name: Post-deploy production release gate
        env:
          GATE_HEALTH_URL: ${{ secrets.PROD_HEALTH_URL }}
          GATE_READY_URL: ${{ secrets.PROD_READY_URL }}
          GATE_PROMETHEUS_URL: ${{ secrets.PROD_PROMETHEUS_URL }}
          GATE_PROMETHEUS_TOKEN: ${{ secrets.PROD_PROMETHEUS_TOKEN }}
        run: python3 deploy/release_gate.py --env production
