services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rawwers}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_data_staging:/data

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
    volumes:
      - meili_data_staging:/meili_data

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    volumes:
      - minio_data_staging:/data

  api:
    image: ghcr.io/${GITHUB_REPOSITORY:-rawwers/rawwers}/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./deploy/.env.staging
    depends_on:
      - postgres
      - redis
      - meilisearch
    ports:
      - "8000:8000"

  worker:
    image: ghcr.io/${GITHUB_REPOSITORY:-rawwers/rawwers}/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: celery -A app.tasks.celery_app.celery_app worker -l info
    env_file:
      - ./deploy/.env.staging
    depends_on:
      - postgres
      - redis

  beat:
    image: ghcr.io/${GITHUB_REPOSITORY:-rawwers/rawwers}/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: celery -A app.tasks.celery_app.celery_app beat -l info
    env_file:
      - ./deploy/.env.staging
    depends_on:
      - postgres
      - redis

  web:
    image: ghcr.io/${GITHUB_REPOSITORY:-rawwers/rawwers}/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./deploy/.env.staging
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data_staging:
  redis_data_staging:
  meili_data_staging:
  minio_data_staging:
