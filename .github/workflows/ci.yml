name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rawwers
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rawwers"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/rawwers
      REDIS_URL: redis://localhost:6379/0
      R2_ENDPOINT_URL: https://example.r2.cloudflarestorage.com
      R2_ACCESS_KEY_ID: test
      R2_SECRET_ACCESS_KEY: test
      R2_BUCKET: rawwers-test
      R2_REGION: auto
      MUX_TOKEN_ID: test
      MUX_TOKEN_SECRET: test
      AUTH_JWT_SECRET: test-insecure-secret
      APP_PUBLIC_URL: http://localhost:3000
      SEARCH_PROVIDER: none
      SEARCH_ENABLED: false
      MEILI_URL: http://localhost:7700
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry==1.8.4

      - name: Install backend dependencies
        working-directory: api
        run: poetry install --no-interaction --no-ansi --with dev

      - name: Lint (ruff)
        working-directory: api
        run: |
          poetry run python -m pip install ruff
          poetry run ruff check app tests

      - name: Type check (mypy, optional)
        working-directory: api
        run: |
          poetry run python -m pip install mypy
          poetry run mypy app || true

      - name: Tests
        working-directory: api
        run: poetry run pytest -q

      - name: Migration discipline check
        working-directory: api
        run: |
          poetry run alembic upgrade head
          poetry run alembic check

      - name: OpenAPI export
        working-directory: api
        run: |
          poetry run python - <<'PY'
          import json
          from app.main import app
          with open('openapi.ci.json', 'w', encoding='utf-8') as f:
              json.dump(app.openapi(), f, indent=2)
          PY

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-openapi
          path: api/openapi.ci.json

      - name: Build backend image
        run: docker build -t ghcr.io/${{ github.repository }}/api:${{ github.sha }} api

  web:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download OpenAPI artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-openapi
          path: api

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: web
        run: pnpm lint

      - name: Typecheck
        working-directory: web
        run: pnpm typecheck

      - name: OpenAPI contract check
        working-directory: web
        env:
          OPENAPI_SCHEMA_URL: ../api/openapi.ci.json
        run: |
          pnpm generate:api
          git diff --exit-code -- lib/api/generated/schema.ts

      - name: Build web
        working-directory: web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: pnpm build

      - name: Unit tests (if present)
        working-directory: web
        run: |
          if pnpm run | grep -q "test"; then
            pnpm test --if-present
          else
            echo "No web unit test script configured."
          fi

      - name: Build web image
        run: docker build -t ghcr.io/${{ github.repository }}/web:${{ github.sha }} web

  flutter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: stable

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Flutter analyze
        working-directory: app
        run: flutter analyze

      - name: Flutter test
        working-directory: app
        run: flutter test

      - name: Check flavor isolation
        working-directory: app
        run: dart run tool/check_flavor_isolation.dart

      - name: Build Android APK (debug) - client
        working-directory: app
        run: flutter build apk --debug --flavor client -t lib/main_client.dart

      - name: Build Android APK (debug) - pro
        working-directory: app
        run: flutter build apk --debug --flavor pro -t lib/main_pro.dart

      - name: Upload client APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rawwers-client-apk-debug
          path: app/build/app/outputs/flutter-apk/app-client-debug.apk

      - name: Upload pro APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rawwers-pro-apk-debug
          path: app/build/app/outputs/flutter-apk/app-pro-debug.apk

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Python dependency scan (pip-audit)
        run: |
          python -m pip install --upgrade pip pip-audit poetry==1.8.4 poetry-plugin-export
          cd api
          poetry export --without-hashes --format=requirements.txt --output requirements.ci.txt
          pip-audit -r requirements.ci.txt || true

      - name: Node dependency scan (pnpm audit)
        working-directory: web
        run: pnpm audit --audit-level=high || true

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Basic SAST (Semgrep)
        run: |
          python -m pip install semgrep
          semgrep --config=p/security-audit --error --exclude=.next api web || true

      - name: Build images for container scan
        run: |
          docker build -t rawwers-api:${{ github.sha }} api
          docker build -t rawwers-web:${{ github.sha }} web

      - name: Trivy scan (api image)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: rawwers-api:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Trivy scan (web image)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: rawwers-web:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
