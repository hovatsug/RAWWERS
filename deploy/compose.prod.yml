services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_data_prod:/data

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
    volumes:
      - meili_data_prod:/meili_data

  api:
    image: ghcr.io/${GITHUB_REPOSITORY:-rawwers/rawwers}/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./deploy/.env.prod
    depends_on:
      - postgres
      - redis
      - meilisearch
    ports:
      - "8000:8000"

  worker:
    image: ghcr.io/${GITHUB_REPOSITORY:-rawwers/rawwers}/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: celery -A app.tasks.celery_app.celery_app worker -l info
    env_file:
      - ./deploy/.env.prod
    depends_on:
      - postgres
      - redis

  web:
    image: ghcr.io/${GITHUB_REPOSITORY:-rawwers/rawwers}/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./deploy/.env.prod
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data_prod:
  redis_data_prod:
  meili_data_prod:
